name: TSC

on: [pull_request]

jobs:
  vue-tsc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm i

      - name: Run vue-tsc
        run: npx vue-tsc --noEmit
